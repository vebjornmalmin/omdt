name: LidarScan
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OPTIMIZATION_LEVEL: "-Ounchecked"
    SWIFT_COMPILATION_MODE: wholemodule
    OTHER_SWIFT_FLAGS: "-enforce-exclusivity=unchecked"
    GCC_OPTIMIZATION_LEVEL: "3"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LidarScan:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LiDAR Scan
        UILaunchScreen: {}
        NSCameraUsageDescription: The camera is used together with the LiDAR sensor to capture colored 3D scans.
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vebjorn.LidarScan
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NZ4N34CKA4
        ENABLE_PREVIEWS: YES
